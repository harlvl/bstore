micronaut:
  application:
    name: bstore

datasources:
  default:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    schema: ${DATABASE_SCHEMA}
    driverClassName: ${DATABASE_DRIVER}
    dialect: POSTGRES

    # Connection pool settings (HikariCP)
    maximum-pool-size: 10
    minimum-idle: 5
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    auto-commit: true